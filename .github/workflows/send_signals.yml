name: Send Signals to Telegram

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    
    # Este "if" es el interruptor: si SCANNER_PAUSED es true, el job no se ejecuta.
    if: vars.SCANNER_PAUSED != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: |
            sent_signals.json
            bot_state.json
          key: signals-state-${{ github.run_id }}
          restore-keys: |
            signals-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect and send signals
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python detect_signals.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sent_signals.json
          key: signals-state-${{ github.run_id }}
